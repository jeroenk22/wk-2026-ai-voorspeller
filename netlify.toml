# ── Build ─────────────────────────────────────────────────
[build]
  base    = "frontend"
  command = "pnpm install && pnpm build"
  publish = "dist"
  functions = "../netlify/functions"

[build.environment]
  NODE_VERSION  = "22"
  PNPM_VERSION  = "latest"

# ── Redirects ─────────────────────────────────────────────
# API calls → Netlify Function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback — alle routes naar index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Lokale development (netlify dev) ──────────────────────
[dev]
  command   = "pnpm dev"
  port      = 8888
  targetPort = 5173
  autoLaunch = true

# ── Headers ───────────────────────────────────────────────
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
